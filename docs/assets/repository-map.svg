<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">PickSort VLA 和 ROS 2 分拣工作单元关系图</title>
  <desc id="desc">从合成多视角数据到策略训练、MuJoCo评估、ROS2和Gazebo工作单元的离线集成关系。</desc>
  <defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#334155;stroke-width:2}.blue{fill:#eff6ff;stroke:#1d4ed8;stroke-width:2}.green{fill:#f0fdf4;stroke:#15803d;stroke-width:2}.t{font-family:Arial,sans-serif;fill:#0f172a}.h{font-size:21px;font-weight:700}.s{font-size:16px}.n{font-size:14px;fill:#475569}.a{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0L10,3L0,6Z" fill="#475569"/></marker></defs>
  <rect class="bg" width="1200" height="390" rx="14"/>
  <text class="t h" x="45" y="48">PickSort-VLA · 仿真与 ROS 2 分拣工作单元</text>
  <text class="t n" x="45" y="74">所有节点面向离线仿真、回放或 dry-run；不表示真实机械臂已执行</text>
  <rect class="blue" x="45" y="135" width="190" height="105" rx="10"/><text class="t h" x="71" y="174">合成多视角数据</text><text class="t s" x="71" y="203">RGB-D / 语言 / 状态</text><text class="t n" x="71" y="225">域随机化</text>
  <rect class="blue" x="315" y="135" width="185" height="105" rx="10"/><text class="t h" x="343" y="174">VLA 策略</text><text class="t s" x="343" y="203">BC / ACT / Temporal</text><text class="t n" x="343" y="225">动作块与残差</text>
  <rect class="box" x="580" y="135" width="185" height="105" rx="10"/><text class="t h" x="611" y="174">MuJoCo 评估</text><text class="t s" x="611" y="203">任务、碰撞、指标</text><text class="t n" x="611" y="225">可重复种子</text>
  <rect class="green" x="845" y="135" width="260" height="105" rx="10"/><text class="t h" x="873" y="174">ROS 2 / Gazebo 工作单元</text><text class="t s" x="873" y="203">感知、规划、控制器、验证</text><text class="t n" x="873" y="225">独立导入 · MIT 保留</text>
  <path class="a" d="M235 188H315"/><path class="a" d="M500 188H580"/><path class="a" d="M765 188H845"/>
  <text class="t n" x="45" y="325">来源：picksort-vla 主线 + ros2-vision-guided-sorting-cell@a7c53de；结构与证据详见 docs/CONSOLIDATION.md。</text>
</svg>
