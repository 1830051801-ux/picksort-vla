# Spatial-grounding Temporal VLA. The visual grid is flattened through a
# learned projection instead of globally averaged, preserving object location.
training:
  policy: temporal_vla
  epochs: 32
  batch_size: 64
  learning_rate: 0.0002
  weight_decay: 0.00001
  validation_fraction: 0.20
  seed: 20260925
  device: auto
  num_workers: 0
  gradient_clip_norm: 1.0
  loss_kind: smooth_l1
  include_failed_expert_labels: true
  goal_loss_weight: 0.35
  stage_loss_weight: 0.20

model:
  robot_state_dim: 29
  action_dim: 6
  action_horizon: 12
  observation_horizon: 6
  d_model: 128
  nhead: 4
  temporal_layers: 3
  decoder_layers: 3
  language_layers: 2
  feedforward_dim: 256
  language_max_length: 64
  vision_grid_size: 5
  vision_pooling: flatten
  dropout: 0.05
  squash_actions: true
  freeze_vision: false
  freeze_language: false
