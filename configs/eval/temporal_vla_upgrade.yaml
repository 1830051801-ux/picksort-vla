seed_start: 20260940
episodes_per_suite: 8
max_episode_steps: 240
image_size: 64
replan_interval: 2
suites: [id, paraphrase, ood, physics, perception]
six_axis: true
mission_length: 3
gif_frame_stride: 4

physics_randomization:
  enabled: true
  object_mass_scale: [0.55, 1.55]
  friction_scale: [0.45, 1.70]
  camera_position_std_m: 0.015
  camera_fovy_delta_deg: 4.0
  light_intensity_scale: [0.65, 1.35]
  object_color_jitter: 0.12
  robot_state_noise_std: 0.003
  detection_noise_std_m: 0.006
  control_delay_steps: [1, 3]

perception_randomization:
  enabled: true
  object_mass_scale: [1.0, 1.0]
  friction_scale: [1.0, 1.0]
  camera_position_std_m: 0.0
  camera_fovy_delta_deg: 0.0
  light_intensity_scale: [1.0, 1.0]
  object_color_jitter: 0.0
  robot_state_noise_std: 0.0
  detection_noise_std_m: 0.0
  control_delay_steps: [0, 0]
  image_noise_std_px: 14.0
  image_occlusion_probability: 0.55
  image_occlusion_max_fraction: 0.20
  vision_latency_frames: [1, 3]
