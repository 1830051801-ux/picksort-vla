seed_start: 20260980
episodes_per_suite: 1
max_episode_steps: 120
image_size: 64
replan_interval: 1
suites: [id, paraphrase, ood, physics, perception]
six_axis: true
mission_length: 1
gif_frame_stride: 10

physics_randomization:
  enabled: true
  object_mass_scale: [0.70, 1.30]
  friction_scale: [0.65, 1.45]
  camera_position_std_m: 0.006
  camera_fovy_delta_deg: 2.0
  light_intensity_scale: [0.75, 1.25]
  object_color_jitter: 0.08
  robot_state_noise_std: 0.002
  detection_noise_std_m: 0.003
  control_delay_steps: [0, 2]

perception_randomization:
  enabled: true
  object_mass_scale: [1.0, 1.0]
  friction_scale: [1.0, 1.0]
  camera_position_std_m: 0.0
  camera_fovy_delta_deg: 0.0
  light_intensity_scale: [1.0, 1.0]
  object_color_jitter: 0.0
  robot_state_noise_std: 0.0
  detection_noise_std_m: 0.0
  control_delay_steps: [0, 0]
  image_noise_std_px: 8.0
  image_occlusion_probability: 0.25
  image_occlusion_max_fraction: 0.15
  vision_latency_frames: [1, 2]
