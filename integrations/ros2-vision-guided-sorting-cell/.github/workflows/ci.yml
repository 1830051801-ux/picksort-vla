name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate project files
        run: python tools/check_project.py
      - name: Run core tests
        run: python -m pytest -q

  ros2-build-test-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ROS_DOMAIN_ID: "77"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ros-tooling/setup-ros@649ef6bcd696da05bc27ceb3fab69d810c0daeab # v0.7
        with:
          required-ros-distributions: jazzy
      - name: Install ROS and Gazebo dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ros-jazzy-desktop \
            ros-jazzy-ros-gz \
            ros-jazzy-gz-ros2-control \
            ros-jazzy-joint-state-broadcaster \
            ros-jazzy-joint-trajectory-controller \
            ros-jazzy-ros2controlcli \
            ros-jazzy-xacro \
            xvfb
          rosdep update
          rosdep install --from-paths src --ignore-src --rosdistro jazzy -r -y
      - name: Build workspace
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --event-handlers console_direct+
      - name: Run ROS package tests
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          set +e
          colcon test --event-handlers console_direct+ --return-code-on-test-failure
          test_status=$?
          colcon test-result --verbose
          result_status=$?
          set -e
          if ((test_status != 0 || result_status != 0)); then
            exit 1
          fi
      - name: Expand and validate robot model
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          xacro "$(ros2 pkg prefix sorting_cell_description)/share/sorting_cell_description/urdf/sorting_arm.urdf.xacro" > /tmp/sorting_arm.urdf
          check_urdf /tmp/sorting_arm.urdf
      - name: Validate Gazebo world SDF
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          gz sdf -k src/sorting_cell_gazebo/worlds/sorting_cell.sdf
      - name: Verify live vision-to-motion sorting loop
        shell: bash
        run: |
          chmod +x tools/run_ros2_demo.sh
          ./tools/run_ros2_demo.sh \
            --skip-build \
            --timeout 300 \
            --output-dir results/ci-ros2-runtime
      - name: Upload ROS runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ros2-runtime-evidence
          path: results/ci-ros2-runtime/
          if-no-files-found: warn
          retention-days: 14
